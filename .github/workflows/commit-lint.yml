name: Audit Squash Commit Messages

on:
  push:
    branches:
      - main
      - lite-202305

jobs:
  squash-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get merge commit message
        run: |
          msg=$(git log -1 --pretty=format:"%B")
          echo "Commit message:"
          echo "$msg"

          if echo "$msg" | grep -q "^* "; then
            echo "Invalid squash message: contains consolidated commits."
            echo "Please squash with PR title only."
            exit 1
          fi

          echo "Commit message looks good."
